# ─────────────────────────────────────────────────────────────────────────────
# docker-compose.yml — momentum-ops LOCAL DEVELOPMENT (all-in-one)
#
# Runs the complete stack on a single machine for development and testing.
# For production, use the per-host compose files in infrastructure/deploy/:
#
#   db-server        → docker-compose.db.yml
#   prefect-server   → docker-compose.prefect.yml
#   dashboard-server → docker-compose.dashboard.yml
#   ml-server        → docker-compose.ml.yml
#
# Services:
#   postgres   — PostgreSQL 18 with baseline DDL (app data)
#   prefect-db — PostgreSQL 16 for Prefect server metadata
#   prefect    — Prefect 3 API server + UI (:4200)
#   worker     — Prefect ingestion worker
#   dashboard  — Streamlit multipage dashboard
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── App PostgreSQL ──────────────────────────────────────────────────────
  postgres:
    image: postgres:18-alpine
    container_name: momentum-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-momentum_db}
      POSTGRES_USER: ${DB_USER:-momentum_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-momentum_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/ddl/baseline.sql:/docker-entrypoint-initdb.d/01_baseline.sql
    ports:
      - "5432:5432"
    networks:
      - momentum-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-momentum_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Prefect Metadata PostgreSQL ─────────────────────────────────────────
  prefect-db:
    image: postgres:16-alpine
    container_name: momentum-prefect-db
    environment:
      POSTGRES_DB: prefect
      POSTGRES_USER: prefect
      POSTGRES_PASSWORD: ${PREFECT_DB_PASSWORD:-prefect_password}
    volumes:
      - prefect_db_data:/var/lib/postgresql/data
    networks:
      - momentum-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prefect"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Prefect Server (API + UI) ──────────────────────────────────────────
  prefect:
    image: prefecthq/prefect:3-latest
    container_name: momentum-prefect
    entrypoint: ["prefect", "server", "start", "--host", "0.0.0.0"]
    environment:
      PREFECT_SERVER_DATABASE_CONNECTION_URL: "postgresql+asyncpg://prefect:${PREFECT_DB_PASSWORD:-prefect_password}@prefect-db:5432/prefect"
      PREFECT_API_URL: "http://prefect:4200/api"
      PREFECT_SERVER_API_HOST: "0.0.0.0"
      PREFECT_SERVER_API_PORT: "4200"
    ports:
      - "4200:4200"
    depends_on:
      prefect-db:
        condition: service_healthy
    networks:
      - momentum-network
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:4200/api/health').raise_for_status()"]
      interval: 15s
      timeout: 10s
      start_period: 20s
      retries: 5
    restart: unless-stopped

  # ── Prefect Ingestion Worker ────────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.worker
    container_name: momentum-worker
    volumes:
      - model_artifacts:/opt/momentum-ops/model_artifacts
    environment:
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-momentum_db}
      DB_USER: ${DB_USER:-momentum_user}
      DB_PASSWORD: ${DB_PASSWORD:-momentum_password}
      DEFAULT_TICKER: ${DEFAULT_TICKER:-AAPL}
      PREFECT_API_URL: ${PREFECT_API_URL:-http://prefect:4200/api}
    depends_on:
      postgres:
        condition: service_healthy
      prefect:
        condition: service_healthy
    networks:
      - momentum-network
    restart: unless-stopped

  # ── Streamlit Dashboard ─────────────────────────────────────────────────
  dashboard:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.dashboard
    container_name: momentum-dashboard
    ports:
      - "8501:8501"
    volumes:
      - model_artifacts:/opt/momentum-ops/model_artifacts
    environment:
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-momentum_db}
      DB_USER: ${DB_USER:-momentum_user}
      DB_PASSWORD: ${DB_PASSWORD:-momentum_password}
      DEFAULT_TICKER: ${DEFAULT_TICKER:-AAPL}
    depends_on:
      postgres:
        condition: service_healthy
      worker:
        condition: service_started
    networks:
      - momentum-network
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      start_period: 5s
      retries: 3
    restart: unless-stopped

networks:
  momentum-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  prefect_db_data:
    driver: local
  model_artifacts:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${MODEL_ARTIFACTS_HOST_PATH:?Set MODEL_ARTIFACTS_HOST_PATH in .env}
