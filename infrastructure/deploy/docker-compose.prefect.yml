# ─────────────────────────────────────────────────────────────────────────────
# docker-compose.prefect.yml — Prefect ingestion server
#
# Host: prefect-server
# Services:
#   prefect    — Prefect 3 API server + UI (port 4200, SQLite backend)
#   worker     — Prefect ingestion worker (connects to external app DB)
#
# Ports: 4200 (Prefect UI/API)
#
# Usage:
#   docker compose -f docker-compose.prefect.yml --env-file .env up -d
#
# After first boot:
#   PREFECT_API_URL=http://localhost:4200/api ./scripts/bootstrap_prefect.sh
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Prefect Server (API + UI, SQLite backend) ──────────────────────────
  prefect:
    image: prefecthq/prefect:3-latest
    container_name: momentum-prefect
    entrypoint: ["prefect", "server", "start", "--host", "0.0.0.0"]
    environment:
      PREFECT_SERVER_API_HOST: "0.0.0.0"
      PREFECT_SERVER_API_PORT: "4200"
      # URL the browser UI uses to reach the API (must be routable from your machine)
      PREFECT_UI_API_URL: ${PREFECT_UI_API_URL:-http://172.27.2.200:4200/api}
    volumes:
      - prefect_data:/root/.prefect
    ports:
      - "4200:4200"
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:4200/api/health').raise_for_status()"]
      interval: 15s
      timeout: 10s
      start_period: 20s
      retries: 5
    restart: unless-stopped

  # ── Prefect Ingestion Worker ────────────────────────────────────────────
  worker:
    build:
      context: ../../
      dockerfile: infrastructure/docker/Dockerfile.worker
    container_name: momentum-worker
    volumes:
      - model_artifacts:/opt/momentum-ops/model_artifacts
      - kis_token:/opt/momentum-ops/ephemeral
    environment:
      # App DB — remote db-server
      DB_HOST: ${DB_HOST:?Set DB_HOST to db-server IP}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-momentum_db}
      DB_USER: ${DB_USER:-momentum_user}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DEFAULT_TICKER: ${DEFAULT_TICKER:-AAPL}
      # KIS token renewal
      KIS_APP_KEY: ${KIS_APP_KEY:-}
      KIS_APP_SECRET: ${KIS_APP_SECRET:-}
      KIS_API_BASE_URL: ${KIS_API_BASE_URL:-https://openapi.koreainvestment.com:9443}
      KIS_TOKEN_PATH: /opt/momentum-ops/ephemeral/token.json
      # Prefect API — local prefect service
      PREFECT_API_URL: http://prefect:4200/api
    depends_on:
      prefect:
        condition: service_healthy
    restart: unless-stopped

volumes:
  prefect_data:
    driver: local
  model_artifacts:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${MODEL_ARTIFACTS_HOST_PATH:-./model_artifacts}
  kis_token:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${KIS_TOKEN_HOST_PATH:-./ephemeral}
