# ─────────────────────────────────────────────────────────────────────────────
# docker-compose.db.yml — PostgreSQL DB server (app data)
#
# Host: db-server
# Ports: 5432 (accessible to prefect-server, dashboard-server, ml-server)
#
# Usage:
#   docker compose -f docker-compose.db.yml --env-file .env up -d
# ─────────────────────────────────────────────────────────────────────────────

services:
  postgres:
    image: postgres:18-alpine
    container_name: momentum-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-momentum_db}
      POSTGRES_USER: ${DB_USER:-momentum_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../infrastructure/ddl/baseline.sql:/docker-entrypoint-initdb.d/01_baseline.sql
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-momentum_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    # Tuning for production (override via environment or custom postgresql.conf)
    command:
      - "postgres"
      - "-c" 
      - "shared_buffers=256MB"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "maintenance_work_mem=128MB"
      - "-c"
      - "effective_cache_size=768MB"
      - "-c"
      - "log_min_duration_statement=1000"

volumes:
  postgres_data:
    driver: local
