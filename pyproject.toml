[project]
name = "momentum-ops"
version = "2.0.0"
description = "Production-grade stock momentum prediction system with multi-horizon XGBoost models"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Momentum Ops Team" }]

# ── Core dependencies shared by ALL services ──────────────────────────────────
dependencies = [
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "psycopg[binary]>=3.2.0",
    "psycopg-pool>=3.2.0",
    "pandas>=2.2.3",
    "numpy>=1.26.4",
    "python-dotenv>=1.0.1",
    "tabulate>=0.9.0",
]

# ── Optional dependency groups (install via `uv pip install -e '.[group]'`) ───
[project.optional-dependencies]
ingestion = [
    "yfinance>=0.2.50",
    "xgboost>=2.1.0",
    "prefect>=3.0.0",
    "psycopg[binary]>=3.2.0",
    "ta>=0.11.0",
]
ml = [
    "xgboost>=2.1.0",
    "shap>=0.46.0",
    "optuna>=4.0.0",
    "scikit-learn>=1.5.2",
    "psycopg[binary]>=3.2.0",
    "python-dotenv>=1.0.0",
    "yfinance>=0.2.50",
    "ta>=0.11.0",
]
dashboard = [
    "streamlit>=1.44.0",
    "plotly>=5.24.0",
    "yfinance>=0.2.50",
    "xgboost>=2.1.0",
    "ta>=0.11.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shared", "ingestion", "models", "dashboard", "scripts"]

# ── Ruff (linter + formatter) ─────────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]

[tool.ruff.lint.isort]
known-first-party = ["shared", "ingestion", "models", "dashboard"]

# ── Pytest ─────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests requiring a live DB",
]

# ── Mypy ───────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
